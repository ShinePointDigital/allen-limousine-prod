services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://allan:${POSTGRES_PASSWORD}@database:5432/allan_livery?connection_limit=10&pool_timeout=10
      SESSION_SECRET: ${SESSION_SECRET}
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: allan_livery
      POSTGRES_USER: allan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - allan_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allan -d allan_livery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  allan_database: